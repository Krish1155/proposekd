<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Love Page</title>

<style>

body{
margin:0;
font-family:Arial;
text-align:center;
background:#ff1a1a;
color:white;
overflow:hidden;
}

.container{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
}

button{
padding:12px 25px;
margin:10px;
font-size:18px;
border:none;
border-radius:25px;
cursor:pointer;
}

#yesBtn{
background:white;
color:red;
}

.noBtn{
background:#ff4d4d;
color:white;
animation:float 2s infinite ease-in-out;
}

@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0px);}
}

.heart{
position:absolute;
color:white;
font-size:20px;
animation:heartMove 5s linear infinite;
}

@keyframes heartMove{
from{transform:translateY(100vh);}
to{transform:translateY(-10vh);}
}

.firework{
position:absolute;
color:white;
font-size:25px;
animation:firework 2s linear infinite;
}

@keyframes firework{
0%{opacity:1; transform:scale(0);}
100%{opacity:0; transform:scale(3);}
}

#result{
font-size:35px;
display:none;
animation:float 3s infinite ease-in-out;
}

footer{
position:absolute;
bottom:5px;
width:100%;
font-size:12px;
}

</style>
</head>

<body>

<!-- Background Music -->
<iframe width="0" height="0"
src="https://www.youtube.com/embed/G4fblHBkB7Y?autoplay=1&loop=1&playlist=G4fblHBkB7Y"
frameborder="0"
allow="autoplay">
</iframe>

<div class="container" id="mainUI">

<h1>Do you love me?</h1>

<button id="yesBtn">Yes</button>

<button class="noBtn" onclick="nextNo(this)">No</button>

<div id="extraButtons"></div>

</div>

<div class="container">

<div id="result">
Congratulations, you've sucessfully proposed the most cutest man
</div>

</div>

<footer>
All rights reserved by Krish Navin
</footer>

<script>

let steps=[
"Are you sure?",
"I don't think you're sure!!",
"Please don't do that 😢",
"Please patt jao yar 😔",
"Mein khud hi click kerdunga yes pe 😠"
];

let index=0;

function nextNo(btn){

/* remove clicked button */
if(btn){
btn.remove();
}

let text=steps[index];

let newBtn=document.createElement("button");

newBtn.innerText=text;

newBtn.className="noBtn";

newBtn.onclick=function(){

newBtn.remove();

index++;

if(index>=steps.length){
index=0;
}

nextNo();

};

document.getElementById("extraButtons").appendChild(newBtn);

}

document.getElementById("yesBtn").onclick=function(){

document.getElementById("mainUI").style.display="none";

document.getElementById("result").style.display="block";

startFireworks();

}

function createHeart(){

let heart=document.createElement("div");

heart.className="heart";

heart.innerText="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(20+Math.random()*20)+"px";

document.body.appendChild(heart);

setTimeout(()=>{heart.remove()},5000);

}

setInterval(createHeart,500);

function startFireworks(){

setInterval(()=>{

let fw=document.createElement("div");

fw.className="firework";

fw.innerText="✨";

fw.style.left=Math.random()*100+"vw";

fw.style.top=Math.random()*100+"vh";

document.body.appendChild(fw);

setTimeout(()=>{fw.remove()},2000);

},200);

}

</script>

</body>
</html>
